name: Coffee tests

on:
  push:

jobs:
  tests:
    name: Тесты на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r testing/requirements.txt

      - name: Тесты кофейни (лаба 4)
        working-directory: Coffee
        run: python -m unittest test_coffee.py -v

      - name: Тесты сервера
        working-directory: testing
        run: python -m unittest test_server -v
